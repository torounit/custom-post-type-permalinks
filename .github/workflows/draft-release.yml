name: Draft Release
on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  draft-release:
    name: Create Draft Release
    # Only for merged release PRs (release/<version> branches).
    if: github.event.pull_request.merged && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}

      - name: Get version
        id: version
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: echo "version=${BRANCH#release/}" >> $GITHUB_OUTPUT

      # Release Check runs this on the PR too; it fails here if the PR was merged anyway.
      - name: Check the versions and the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bin/check-version.sh "$VERSION" --untagged

      - name: Extract release notes from the changelog
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: bin/check-version.sh --notes "$VERSION" > release-notes.md

      # The tag is created on the merge commit when the draft is published in the web UI.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TARGET: ${{ github.event.pull_request.merge_commit_sha }}
        run: gh release create "$VERSION" --draft --target "$TARGET" --title "$VERSION" --notes-file release-notes.md
